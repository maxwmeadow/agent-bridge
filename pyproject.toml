[project]
name = "agent-bridge"
version = "0.1.0"
description = "Local persistent message bridge between Claude Code and Codex over MCP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0.0",
]

[project.scripts]
agent-bridge = "agent_bridge.cli:main"
agent-bridge-mcp = "agent_bridge.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_bridge"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "mypy>=1.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
files = ["src/agent_bridge"]
strict = true
warn_unreachable = true
